<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sevgi maktubi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Caveat:wght@500;700&display=swap">
<style>
:root{--bg:#f9e4e4;--ink:#3b1530;--mut:#8a5a6c;--card:#fff6f1;--line:#efc9d0;--rose:#d63a62;--paper:#fffaf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0c1e;--ink:#fbe6ea;--mut:#c795a8;--card:#2c1430;--line:#4f2956;--paper:#fffaf0}}
:root[data-theme="dark"]{--bg:#1d0c1e;--ink:#fbe6ea;--mut:#c795a8;--card:#2c1430;--line:#4f2956}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Fraunces",Georgia,serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:18px 18px 110px}
h1{font-size:30px;line-height:1.1;margin:6px 0 4px;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px;font-size:15px}
.dots{display:flex;gap:6px;margin-bottom:18px}
.dots i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background .4s}
.dots i.on{background:var(--rose)}
section{display:none}section.on{display:block}
textarea{width:100%;height:230px;border:0;border-radius:6px;padding:18px 18px 18px 22px;font:500 24px/32px "Caveat",cursive;color:#5b2a3c;background:var(--paper) repeating-linear-gradient(transparent 0 31px,#f0d4d4 31px 32px);box-shadow:0 10px 30px #3b153033;resize:none;outline:none}
textarea:focus{box-shadow:0 10px 30px #3b153033,0 0 0 3px var(--rose)}
.cnt{text-align:right;color:var(--mut);font-size:13px;margin-top:6px}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:60px 4px 18px;margin:0 -18px;padding-inline:18px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.card{flex:0 0 64%;scroll-snap-align:center;border:2px solid var(--line);border-radius:18px;background:var(--card);padding:56px 8px 14px;text-align:center;cursor:pointer;transition:border-color .3s,transform .3s;min-width:230px}
.card.sel{border-color:var(--rose);transform:translateY(-4px)}
.card{perspective:900px}
.card b{display:block;font-size:18px}.card small{color:var(--mut)}
.card .env{margin-bottom:22px;transform:scale(.8)}
.price{color:var(--rose);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bq{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:6px 4px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:border-color .3s}
.bq.sel{border-color:var(--rose)}
.bq svg{width:100%;height:170px}.bq span{display:block;font-size:14px;font-weight:700}.bq small{color:var(--mut);font-size:12px}
.sum{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:6px 16px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.sum div:last-child{border:0;font-size:20px;font-weight:700}
.note{color:var(--mut);font-size:14px;margin-top:12px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:20}
.bar div{max-width:480px;margin:0 auto;display:flex;gap:10px}
button.btn{flex:1;border:0;border-radius:14px;padding:15px;font:700 17px "Fraunces",serif;background:var(--rose);color:#fff;cursor:pointer;box-shadow:0 8px 20px #d63a6255;transition:transform .15s}
button.btn:active{transform:scale(.97)}
button.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none;border:2px solid var(--line);flex:0 0 auto;padding:15px 20px}
button.btn.sm{flex:0 0 auto;padding:10px 18px;font-size:15px;margin-top:6px}
.pv{text-align:center;margin-top:4px}
#to{width:100%;margin-top:14px;border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--card);color:var(--ink);font:500 16px "Fraunces",serif}
/* envelope */
.env{--c:#f4aab9;--c2:#df7f97;--sl:radial-gradient(circle at 35% 30%,#f06a86,#a81f45);position:relative;width:240px;height:160px;margin:0 auto;perspective:700px}
.env>*{position:absolute}
.back{inset:0;background:var(--c2);border-radius:6px}
.letter{left:14px;right:14px;top:10px;bottom:10px;background:var(--paper) repeating-linear-gradient(transparent 0 11px,#f0d4d4 11px 12px);border-radius:3px;z-index:1;box-shadow:0 2px 6px #0002}
.front{inset:0;background:var(--c);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);z-index:3;border-radius:6px}
.flap{left:0;right:0;top:0;height:60%;background:linear-gradient(var(--c),var(--c2));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4}
.seal{left:50%;top:60%;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--sl);z-index:5;display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 3px 8px #0004}
.extra{inset:0;z-index:6;pointer-events:none;overflow:hidden;border-radius:6px}
.v3 .extra::before,.v3 .extra::after{content:"";position:absolute;background:#7a62c9;box-shadow:inset 0 0 0 2px #ffffff40}
.v3 .extra::before{left:0;right:0;top:50%;height:16px;margin-top:-8px}
.v3 .extra::after{top:0;bottom:0;left:50%;width:16px;margin-left:-8px}
.v2{--c:#b8405c;--c2:#8f2842;--sl:radial-gradient(circle at 35% 30%,#f6d27a,#b8862a)}
.v3{--c:#c1b3ef;--c2:#9a86d8;--sl:none;font-size:30px}
.v4{--c:#ee5a70;--c2:#c32f4a}
.v5{--c:#f3dcab;--c2:#d9b66f;--sl:radial-gradient(circle at 35% 30%,#f06a86,#a81f45)}
.v6{--c:#f7bd9f;--c2:#e2926f;--sl:radial-gradient(circle at 35% 30%,#fff,#f4b4c2)}
.v6 .seal{color:#c2325a}
@keyframes flap{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{transform:rotateX(90deg);z-index:0}100%{transform:rotateX(180deg);z-index:0}}
@keyframes rise{to{transform:translateY(-92px)}}
@keyframes rise2{60%{transform:translateY(-120px) rotate(-3deg)}to{transform:translateY(-100px) rotate(0)}}
@keyframes gone{to{opacity:0;transform:scale(.4)}}
@keyframes crack{12%{transform:rotate(-12deg) scale(1.15)}26%{transform:rotate(12deg) scale(1.2)}40%{transform:rotate(-8deg) scale(1.3)}100%{transform:translateY(150px) rotate(70deg) scale(.5);opacity:0}}
@keyframes fly{0%{transform:scale(1)}30%{transform:scale(1.5) translateY(-10px)}100%{transform:translateY(-190px) scale(2.2);opacity:0}}
@keyframes bandX{to{transform:translateX(110%)}}
@keyframes bandY{to{transform:translateY(110%)}}
@keyframes drop{to{transform:translateY(80px);opacity:0}}
.open .flap{animation:flap .7s forwards cubic-bezier(.5,0,.3,1)}
.open .letter{animation:rise .8s .6s forwards cubic-bezier(.2,.8,.2,1)}
.open .seal{animation:gone .3s forwards}
.open.v2 .seal{animation:crack .9s forwards}
.open.v2 .flap{animation-delay:.85s}.open.v2 .letter{animation-delay:1.45s}
.open.v3 .seal{animation:gone .5s forwards}
.open.v3 .extra::before{animation:bandX .7s forwards cubic-bezier(.6,0,.4,1)}
.open.v3 .extra::after{animation:bandY .7s .1s forwards cubic-bezier(.6,0,.4,1)}
.open.v3 .flap{animation-delay:.75s}.open.v3 .letter{animation-delay:1.35s}
.open.v4 .seal{animation:fly .8s forwards}
.open.v4 .flap{animation-delay:.5s}.open.v4 .letter{animation-delay:1.1s}
.open.v5 .front{animation:drop .8s .55s forwards}
.open.v5 .letter{animation:rise2 1s .8s forwards}
.open.v6 .flap{animation-duration:1s}.open.v6 .letter{animation-delay:.9s}
.papers{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none;padding:3px}
.pc{flex:0 0 auto;border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:700 13px "Fraunces",serif;cursor:pointer}
.pc.sel{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose)}
.sw{transform-box:view-box;transform-origin:100px 214px;animation:sway 3.4s ease-in-out var(--w,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-3.2deg)}to{transform:rotate(3.2deg)}}
.env,.flap,.letter,.seal{will-change:transform}
#stage{perspective:1000px}
.v1{--fd:.2s;--ld:1.2s}.v2{--fd:1.7s;--ld:2.7s}.v3{--fd:2.6s;--ld:3.6s}.v4{--fd:1.1s;--ld:2.1s}.v5{--fd:.9s;--ld:1.8s}.v6{--fd:.3s;--ld:1.6s}
.v3 .seal{font-size:34px;width:44px;height:44px;margin:-22px 0 0 -22px;z-index:7;box-shadow:none}
.v3 .extra::before{transform-origin:right center}.v3 .extra::after{transform-origin:center top}
@keyframes tilt{0%{rotate:1 0 0 0deg}30%{rotate:1 .6 0 -18deg}65%{rotate:-.3 1 0 14deg}100%{rotate:1 0 0 0deg}}
@keyframes flapA{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{transform:rotateX(90deg);z-index:0}100%{transform:rotateX(180deg);z-index:0}}
@keyframes riseA{0%{transform:translateY(0) rotateX(0)}55%{transform:translateY(-100px) translateZ(30px) rotateX(-6deg)}100%{transform:translateY(-135px) translateZ(70px) scale(1.12) rotateX(0)}}
@keyframes goneA{to{opacity:0;transform:scale(.4)}}
@keyframes crackA{12%{transform:rotate(-12deg) scale(1.15)}26%{transform:rotate(12deg) scale(1.25)}40%{transform:rotate(-9deg) scale(1.35)}55%{transform:rotate(9deg) scale(1.35)}100%{transform:translateY(150px) rotate(70deg) scale(.5);opacity:0}}
@keyframes flyA{0%{transform:scale(1)}30%{transform:scale(1.6) translateY(-10px)}100%{transform:translateY(-190px) scale(2.4);opacity:0}}
@keyframes bow{0%{transform:scale(1)}35%{transform:scale(1.7) rotate(-8deg)}65%{transform:scale(1.7) rotate(8deg)}100%{transform:scale(2) translateY(-30px);opacity:0}}
@keyframes untieX{to{transform:scaleX(0)}}
@keyframes untieY{to{transform:scaleY(0)}}
@keyframes dropA{to{transform:translateY(90px);opacity:0}}
.env.open{animation:tilt 4.4s ease-in-out}
.env.open[class] .flap{animation:flapA 1.4s var(--fd) forwards cubic-bezier(.45,.05,.25,1)}
.env.open[class] .letter{animation:riseA 1.8s var(--ld) forwards cubic-bezier(.25,.8,.25,1)}
.env.open[class] .seal{animation:goneA .6s forwards}
.env.open.v2[class] .seal{animation:crackA 1.7s forwards}
.env.open.v3[class] .seal{animation:bow 2.2s forwards}
.env.open.v4[class] .seal{animation:flyA 1.8s forwards}
.env.open.v3[class] .extra::before{animation:untieX 1.8s .9s forwards cubic-bezier(.6,0,.4,1)}
.env.open.v3[class] .extra::after{animation:untieY 1.8s 1.1s forwards cubic-bezier(.6,0,.4,1)}
.env.open.v5[class] .front{animation:dropA 1.5s .8s forwards cubic-bezier(.5,0,.3,1)}
.txt.typing::after{content:"|";animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.sw,.txt.typing::after{animation:none!important}}
/* reveal */
#rv{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#4a1a45,#150816);display:none;align-items:center;justify-content:center;flex-direction:column;overflow:auto;padding:24px}
#rv.on{display:flex}
#stage{transform:scale(1.35);margin:70px 0 30px;transition:opacity .6s,transform .8s}
#stage.out{opacity:0;transform:scale(.8) translateY(-60px)}
#paper{display:none;width:100%;max-width:380px;background:var(--paper);color:#5b2a3c;border-radius:8px;padding:24px 22px 18px;text-align:center;box-shadow:0 20px 60px #000a;background-image:repeating-linear-gradient(transparent 0 31px,#f0d4d4 31px 32px)}
#paper.up{display:block;animation:up .9s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(80px) scale(.9);opacity:0}}
#paper .to{font:700 28px "Caveat",cursive;margin:0 0 6px;text-align:left}
#paper .txt{font:500 24px/32px "Caveat",cursive;text-align:left;white-space:pre-wrap;min-height:64px}
#paper svg{width:200px;height:240px;margin:8px auto 0;display:block}
.fl{transform-box:fill-box;transform-origin:50% 50%;animation:bloom .9s var(--d,0s) both cubic-bezier(.3,1.6,.5,1)}
.st{stroke-dasharray:200;animation:grow .8s var(--d,0s) both}
@keyframes bloom{from{transform:scale(0) rotate(-90deg)}}
@keyframes grow{from{stroke-dashoffset:200}}
.acts{display:flex;gap:10px;margin-top:12px}
.acts .btn{box-shadow:none}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main>
<h1>Sevgi maktubi</h1>
<p class="sub" id="sub"></p>
<div class="dots"><i></i><i></i><i></i><i></i></div>

<section id="s0">
<div class="papers" id="papers"></div>
<textarea id="txt" maxlength="400" placeholder="Qalbingdagi gaplarni shu yerga yozing…"></textarea>
<div class="cnt"><span id="n">0</span>/400</div>
</section>

<section id="s1">
<div class="car" id="car"></div>
<div class="pv"><button class="btn sm" id="pv">Ochilishini qayta koʻrish</button></div>
</section>

<section id="s2"><div class="grid" id="grid"></div>
<p class="note">Narxlar namuna sifatida qoʻyilgan.</p></section>

<section id="s3">
<div class="sum">
<div><span>Konvert: <b id="sE"></b></span><span>3 000</span></div>
<div><span>Gul: <b id="sB"></b></span><span id="pB"></span></div>
<div><span>Jami</span><span class="price" id="tot"></span></div>
</div>
<input id="to" maxlength="30" placeholder="Kimga? (masalan: Sevgilimga)">
<p class="note">Yuborgandan keyin bot sizga havola beradi, uni sevgan insoningizga joʻnatasiz.</p>
</section>
</main>

<div class="bar"><div><button class="btn ghost" id="back">Orqaga</button><button class="btn" id="next">Davom etish</button></div></div>

<div id="rv"><div id="stage"></div><div id="paper"></div></div>

<script>
var ENV=[
{n:"Klassik",d:"Qopqoq sekin ochiladi",c:"♥",t:1.6},
{n:"Mum muhr",d:"Muhr yorilib tushadi",c:"✦",t:2.3},
{n:"Atlas lenta",d:"Lenta yechilib ketadi",c:"🎀",t:2.1},
{n:"Yurak",d:"Yurak uchib chiqadi",c:"❤",t:1.9},
{n:"Sirpanish",d:"Old tomoni tushib ketadi",c:"♥",t:2},
{n:"Gulbarg",d:"Qopqoq ochilib, barglar sochiladi",c:"❀",t:2}];
var BQ=[
{n:"Atirgul",p:6000,f:["r","r","r","r","r"]},
{n:"Pion",p:7000,f:["p","p","p","p","p"]},
{n:"Romashka",p:4000,f:["d","d","d","d","d"]},
{n:"Lola",p:5000,f:["t","t","t","t","t"]},
{n:"Aralash",p:6500,f:["r","p","d","t","r"]},
{n:"Gulsiz",p:0,f:[]}];
var S={env:0,bq:-1,step:0,paper:0};
[3.4,5,5.9,4.3,4,3.8].forEach(function(t,i){ENV[i].t=t});
var $=function(i){return document.getElementById(i)};
var NAMES=["Maktubni yozing","Konvertni tanlang","Gul tanlang (ixtiyoriy)","Tekshirib, yuboring"];
var rm=matchMedia("(prefers-reduced-motion:reduce)").matches;

function envHTML(i){return '<div class="env v'+(i+1)+'"><div class="back"></div><div class="letter"></div><div class="front"></div><div class="flap"></div><div class="extra"></div><div class="seal">'+ENV[i].c+'</div></div>'}
function burst(el,ch,n){if(rm)return;var r=el.getBoundingClientRect();for(var k=0;k<n;k++){var s=document.createElement("span");s.textContent=ch[k%ch.length];s.style.cssText="position:fixed;z-index:99;pointer-events:none;font-size:"+(14+Math.random()*16)+"px;left:"+(r.left+r.width/2)+"px;top:"+(r.top+r.height*.4)+"px";document.body.appendChild(s);var dx=(Math.random()-.5)*300,dy=-180+Math.random()*260;s.animate([{transform:"translate(0,0) scale(.3)",opacity:1},{transform:"translate("+dx+"px,"+dy+"px) rotate("+(Math.random()*360)+"deg) scale(1)",opacity:0}],{duration:1300+Math.random()*900,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=(function(x){return function(){x.remove()}})(s)}}
function play(el,i){el.classList.remove("open");void el.offsetWidth;el.classList.add("open");if(i==3)setTimeout(function(){burst(el,["❤️","💗","💖"],16)},1100);if(i==1)setTimeout(function(){burst(el,["✨"],14)},700);if(i==5)setTimeout(function(){burst(el,["🌸","🌹","🌷"],18)},900);return ENV[i].t}

function flower(t,x,y,s,d){var g="",i,k;
if(t=="r"){g='<circle r="22" fill="#b81f43"/><circle r="17" fill="#d93a5e"/><circle r="12" fill="#b81f43"/><circle r="7" fill="#e65a78"/><path d="M-8 0a8 8 0 0 1 16 0M-4 4a5 5 0 0 0 8 0" stroke="#7d1230" fill="none" stroke-width="1.6"/>'}
else if(t=="p"){for(k=0;k<3;k++)for(i=0;i<8;i++)g+='<ellipse rx="'+(11-k*2)+'" ry="'+(18-k*4)+'" cy="-'+(12-k*3)+'" transform="rotate('+(i*45+k*22)+')" fill="'+["#f4a6c0","#f27aa3","#e85888"][k]+'" stroke="#c23a68" stroke-width=".8"/>';g+='<circle r="4" fill="#f6d27a"/>'}
else if(t=="d"){for(i=0;i<12;i++)g+='<ellipse rx="4.5" ry="14" cy="-15" transform="rotate('+(i*30)+')" fill="#fff" stroke="#d8cfd0" stroke-width=".8"/>';g+='<circle r="8" fill="#f4c430"/>'}
else{g='<path d="M-15 -4C-15 -26 -5 -30 0 -36C5 -30 15 -26 15 -4C15 12 -15 12 -15 -4Z" fill="#f0773c"/><path d="M-5 -30C-9 -14 -9 4 0 8C9 4 9 -14 5 -30" fill="#f9a05f"/>'}
return '<g transform="translate('+x+' '+y+') scale('+s+')"><g class="fl" style="--d:'+d+'s">'+g+'</g></g>'}
function bouquet(f){if(!f.length)return'<svg viewBox="0 0 200 240"><text x="100" y="130" text-anchor="middle" font-size="40">✉️</text></svg>';
var P=[[100,62],[62,88],[138,88],[78,118],[122,118]],st="",fl="",i;
for(i=0;i<5;i++){st+='<path class="st" style="--d:'+(i*.12)+'s" d="M'+P[i][0]+' '+P[i][1]+'Q100 150 100 214" stroke="#3f8f4a" stroke-width="4" fill="none"/>';fl+=flower(f[i],P[i][0],P[i][1],.95,.5+i*.14)}
return '<svg viewBox="0 0 200 240">'+st+'<path d="M48 138L152 138L108 236L92 236Z" fill="#f3d3a4" stroke="#d8ae74"/><path d="M92 236L100 200L108 236Z" fill="#e0b985"/>'+fl+'<path d="M84 160Q100 150 116 160L110 172Q100 166 90 172Z" fill="#e8607e"/></svg>'}

function flower(t,x,y,s,d){var g="",i,k;
if(t=="r")g='<circle r="25" fill="#8f1233"/><path d="M-23 -4C-21 -21 -6 -27 5 -24C17 -21 24 -8 21 6C18 20 4 26 -9 23C-20 20 -25 8 -23 -4Z" fill="#c92148" stroke="#8f1233" stroke-width="1.2"/><path d="M-15 -3C-13 -15 -2 -18 6 -15C14 -11 16 -1 13 6C9 15 -2 17 -10 13C-15 10 -16 3 -15 -3Z" fill="#e23a60" stroke="#a51a3d" stroke-width="1.2"/><path d="M-8 -2C-7 -9 0 -11 5 -8C9 -4 9 2 4 6C0 9 -6 7 -8 2Z" fill="#c92148" stroke="#8f1233" stroke-width="1.2"/><path d="M-3 0C-2 -4 2 -4 3 -1" stroke="#6d0f28" fill="none" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="-12" cy="-14" rx="5" ry="2.5" fill="#fff" opacity=".25" transform="rotate(-35 -12 -14)"/>';
else if(t=="p"){for(k=0;k<3;k++)for(i=0;i<10;i++)g+='<ellipse rx="'+(12-k*2.5)+'" ry="'+(19-k*4.5)+'" cy="-'+(13-k*3)+'" transform="rotate('+(i*36+k*18)+')" fill="'+["#f7b3c9","#f48db0","#ea5e8f"][k]+'" stroke="#c23a68" stroke-width="1"/>';g+='<circle r="5" fill="#f6d27a" stroke="#d9a93a"/>'}
else if(t=="d"){for(i=0;i<16;i++)g+='<ellipse rx="4.6" ry="15" cy="-16" transform="rotate('+(i*22.5)+')" fill="#fff" stroke="#cfc3c8" stroke-width="1"/>';g+='<circle r="9" fill="#f4c430" stroke="#d99a10" stroke-width="1.5"/>'}

function build(){var c="",g="",i;

$("txt").oninput=function(){$("n").textContent=this.value.length};

function show(n){S.step=n;for(var i=0;i<4;i++){$("s"+i).classList.toggle("on",i==n);document.querySelectorAll(".dots i")[i].classList.toggle("on",i<=n)}
$("sub").textContent=NAMES[n];$("back").style.display=n?"block":"none";$("next").textContent=n==3?"Toʻlov va yuborish":n==2&&S.bq<0?"Gulsiz davom etish":"Davom etish";
if(n==3){var b=BQ[S.bq<0?5:S.bq];$("sE").textContent=ENV[S.env].n;$("sB").textContent=b.n;$("pB").textContent=b.p?b.p.toLocaleString("ru"):"0";$("tot").textContent=(3000+b.p).toLocaleString("ru")+" soʻm"}
if(n==1)setTimeout(function(){var c=document.querySelector(".card.sel .env");if(c)play(c,S.env)},400);window.scrollTo(0,0)}

$("next").onclick=function(){if(S.step<3)return show(S.step+1);if(INTG){TG.sendData(JSON.stringify({t:$("txt").value.trim(),e:S.env,b:S.bq<0?5:S.bq,p:S.paper,to:$("to").value.trim()}))}else reveal()};
$("back").onclick=function(){show(S.step-1)};
show(0);

var b=atob(q.replace(/-/g,"+").replace(/_/g,"/")),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
